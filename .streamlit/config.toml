# SeaTrace's dark ops theme (the console sets its own; this styles the Analyst pages to match).
[theme]
base = "dark"
primaryColor = "#5cc8ff"
backgroundColor = "#07121a"
secondaryBackgroundColor = "#10212d"
textColor = "#dde8ef"
linkColor = "#5cc8ff"
borderColor = "#1c3141"
dataframeHeaderBackgroundColor = "#152a38"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "IBM Plex Sans Condensed:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 14
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
